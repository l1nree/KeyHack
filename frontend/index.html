<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Война серверов: Битва за узлы</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    
    <style>
        .screen-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 400px; text-align: center;
        }
        .glass-input {
            width: 100%; padding: 12px; margin: 20px 0; box-sizing: border-box;
            background: rgba(0,0,0,0.5); border: 1px solid var(--color-primary, #00ffcc);
            color: white; font-family: 'JetBrains Mono', monospace; border-radius: 4px; outline: none;
        }
        .glass-btn {
            width: 100%; padding: 12px 20px; background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--color-primary, #00ffcc); color: var(--color-primary, #00ffcc);
            font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer; border-radius: 4px; transition: all 0.3s;
        }
        .glass-btn:hover { background: rgba(0, 255, 204, 0.3); }
        .status-ok { color: lime; }
        .status-wait { color: yellow; }
        .logout-link { display: inline-block; margin-top: 15px; color: #aaa; font-size: 12px; text-decoration: underline; cursor: pointer; }
        
        .player-list-item {
            background: rgba(255,255,255,0.1); padding: 10px; margin-bottom: 5px; border-radius: 4px;
            display: flex; justify-content: space-between;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        
        <!-- ЭКРАН 1: АВТОРИЗАЦИЯ -->
        <div id="auth-screen" class="glass-panel screen-container">
            <h2 style="color: var(--color-primary, #00ffcc);">СИСТЕМА ДОСТУПА</h2>
            <input type="text" id="nickname-input" class="glass-input" placeholder="Введите позывной (никнейм)..." maxlength="16">
            <button id="register-btn" class="glass-btn">ИНИЦИАЛИЗАЦИЯ</button>
        </div>

        <!-- ЭКРАН 2: ГЛАВНОЕ МЕНЮ -->
        <div id="game-screen" class="glass-panel screen-container" style="display: none;">
            <h2>ТЕРМИНАЛ ОПЕРАТОРА</h2>
            
            <div style="text-align: left; margin: 20px 0;">
                <p>Позывной: <strong id="player-name-display" style="color: var(--color-primary, #00ffcc);">Unknown</strong></p>
                <div class="code-block" style="margin-top: 10px; font-size: 12px; overflow-wrap: break-word;">
                    UID: <span id="player-id-display">...</span>
                </div>
            </div>

            <p style="margin-bottom: 20px;">Связь с ядром: <span id="ws-status" class="status-wait">Ожидание...</span></p>
            
            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2);">
                <button id="create-lobby-btn" class="glass-btn" style="margin-bottom: 10px; background: rgba(0, 255, 204, 0.2);">СОЗДАТЬ СЕССИЮ</button>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="join-lobby-input" class="glass-input" style="margin: 0; text-transform: uppercase;" placeholder="КОД..." maxlength="4">
                    <button id="join-lobby-btn" class="glass-btn" style="margin: 0;">ПОДКЛЮЧИТЬСЯ</button>
                </div>
            </div>
            <a id="logout-btn" class="logout-link">Очистить кэш (Выйти)</a>
        </div>

        <!-- ЭКРАН 3: КОМНАТА ЛОББИ (НОВОЕ) -->
        <div id="lobby-screen" class="glass-panel screen-container" style="display: none;">
            <h2>СЕССИЯ: <span id="lobby-code-display" style="color: var(--color-primary);">XXXX</span></h2>
            
            <div style="margin: 20px 0; text-align: left;">
                <p>Участники (<span id="lobby-count">1</span>/4):</p>
                <div id="lobby-players-list" style="margin-top: 10px;">
                    <!-- JS будет вставлять игроков сюда -->
                </div>
            </div>
            
            <button id="ready-btn" class="glass-btn" style="margin-bottom: 10px;">ПОДТВЕРДИТЬ ГОТОВНОСТЬ</button>
        </div>
        
        <!-- МОДАЛКА ВЗЛОМА -->
        <div id="hack-modal" class="glass-panel" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; text-align: center;">
            <h2 style="color: var(--color-danger, #ff4444);">ВТОРЖЕНИЕ В УЗЕЛ <span id="target-node-id">0</span></h2>
            <div class="code-block" style="margin: 20px 0;"><span id="hack-timer">10.0</span> сек</div>
            <input type="text" id="hack-input" class="glass-input" placeholder="Введите ключ..." style="margin-bottom: 5px;">
            <button id="cancel-hack-btn" class="glass-btn" style="background: transparent; color: var(--color-text); border-color: var(--color-text);">Отмена</button>
        </div>

    </div>

    <script type="module" src="./js/app.js"></script>
    <script>
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.clear();
            location.reload();
        });
    </script>
</body>
</html>
