<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Война серверов: Битва за узлы</title>
    
    <!-- Подключаем шрифты из дизайн-системы[cite: 1] -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Убираем отступы браузера по умолчанию, чтобы canvas занял весь экран */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Убираем скроллбары */
        }
        
        /* Задаем базовые шрифты для будущего UI[cite: 1] */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>

    <!-- Наш холст -->
    <canvas id="gameCanvas"></canvas>

    <!-- Подключаем главный скрипт как модуль -->
    <script type="module" src="./js/app.js"></script>
    
<!-- === БЛОК ТЕСТИРОВАНИЯ WEBSOCKET (ФАЗА 1) === -->
<!-- Его можно будет удалить, когда перейдем к реальной игре -->
<div style="position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); color: lime; padding: 15px; border-radius: 8px; font-family: monospace; z-index: 9999;">
    <div>Статус WS: <span id="ws-status" style="color: yellow;">Подключение...</span></div>
    <button onclick="testPing()" style="margin: 5px 0; background: #333; color: lime; border: 1px solid lime; cursor: pointer;">Отправить Ping</button>
    <div>Ответ: <span id="ws-response">Нет</span></div>
</div>

<script>
    // Подключаемся к вашему эндпоинту /ws
    const ws = new WebSocket("wss://keyhack.albov.net/ws");

    ws.onopen = () => {
        document.getElementById("ws-status").innerText = "Подключено ✓";
    };

    ws.onmessage = (event) => {
        // Когда сервер пришлет ответ "Эхо сервера: ...", выводим его
        document.getElementById("ws-response").innerText = event.data;
    };

    ws.onerror = (err) => {
        document.getElementById("ws-status").innerText = "Ошибка ✗";
        document.getElementById("ws-status").style.color = "red";
    };

    function testPing() {
        if (ws.readyState === WebSocket.OPEN) {
            ws.send("Ping от клиента!");
        } else {
            alert("Соединение еще не установлено.");
        }
    }
</script>
<!-- === КОНЕЦ БЛОКА ТЕСТИРОВАНИЯ === -->

</body>
</html>
