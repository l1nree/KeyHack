<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Война серверов: Битва за узлы</title>

    <!-- Заглушка для favicon, чтобы избежать ошибки 404 в консоли -->
    <link rel="icon" href="data:,">

    <!-- Подключаем шрифты из дизайн-системы: Inter (UI) и JetBrains Mono (Код) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Подключаем наш файл стилей (Modern FinTech Dashboard)[cite: 1] -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- Слой 1: Наш холст с радиальной сеткой (находится на заднем плане) -->
    <canvas id="gameCanvas"></canvas>

    <!-- Слой 2: Интерфейс Glassmorphism (парит поверх холста)[cite: 1] -->
    <div id="ui-layer">
        
        <!-- Тестовая панель дашборда игрока -->
        <div class="glass-panel player-dashboard">
            <h2>Player_1</h2>
            <p>Статус: <span class="status-ok">Подключен</span></p>
            <div class="code-block">IP: 192.168.1.42</div>
        </div>

        
        <div id="hack-modal" class="glass-panel" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; text-align: center;">
            <h2 style="color: var(--color-danger);">ВТОРЖЕНИЕ В УЗЕЛ <span id="target-node-id">0</span></h2>
            <p>Установите соединение для перехвата контроля.</p>
                
            <div class="code-block" style="margin: 20px 0;">
                    <span id="hack-timer">10.0</span> сек
            </div>

            <!-- Здесь позже появится логика самой мини-игры (например, ввод пароля) -->
            <input type="text" id="hack-input" placeholder="Введите ключ..." style="width: 100%; padding: 10px; box-sizing: border-box; background: rgba(0,0,0,0.5); border: 1px solid var(--color-primary); color: white; font-family: var(--font-code); border-radius: 4px;">
                
            <button id="cancel-hack-btn" style="margin-top: 15px; padding: 10px 20px; background: transparent; border: 1px solid var(--color-text); color: var(--color-text); cursor: pointer; border-radius: 4px;">Отмена</button>
        </div>

    </div>


    <!-- Подключаем главный скрипт как модуль (точка входа) -->
    <script type="module" src="./js/app.js"></script>
    
<!-- === БЛОК ТЕСТИРОВАНИЯ WEBSOCKET (ФАЗА 1) === -->
<!-- Его можно будет удалить, когда перейдем к реальной игре -->
<div style="position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); color: lime; padding: 15px; border-radius: 8px; font-family: monospace; z-index: 9999;">
    <div>Статус WS: <span id="ws-status" style="color: yellow;">Подключение...</span></div>
    <button onclick="testPing()" style="margin: 5px 0; background: #333; color: lime; border: 1px solid lime; cursor: pointer;">Отправить Ping</button>
    <div>Ответ: <span id="ws-response">Нет</span></div>
</div>

<script>
    // Подключаемся к вашему эндпоинту /ws
    const ws = new WebSocket("wss://keyhack.albov.net/ws");

    ws.onopen = () => {
        document.getElementById("ws-status").innerText = "Подключено ✓";
    };

    ws.onmessage = (event) => {
        // Когда сервер пришлет ответ "Эхо сервера: ...", выводим его
        document.getElementById("ws-response").innerText = event.data;
    };

    ws.onerror = (err) => {
        document.getElementById("ws-status").innerText = "Ошибка ✗";
        document.getElementById("ws-status").style.color = "red";
    };

    function testPing() {
        if (ws.readyState === WebSocket.OPEN) {
            ws.send("Ping от клиента!");
        } else {
            alert("Соединение еще не установлено.");
        }
    }
</script>
<!-- === КОНЕЦ БЛОКА ТЕСТИРОВАНИЯ === -->

</body>
</html>
